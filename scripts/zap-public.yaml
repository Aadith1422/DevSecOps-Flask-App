env:
  contexts:
    - name: FlaskPublic
      urls:
        - http://devsecops-flask-staging:5000
      includePaths:
        - 'http://devsecops-flask-staging:5000/$'
        - 'http://devsecops-flask-staging:5000/(login|register|health)$'
      excludePaths:
        - 'http://devsecops-flask-staging:5000/logout.*'
        - 'http://devsecops-flask-staging:5000/students.*'
        - 'http://devsecops-flask-staging:5000/dashboard.*'

  parameters:
    failOnError: true
    failOnWarning: false

jobs:
  - type: requestor
    parameters:
      user: ''
    requests:
      - url: http://devsecops-flask-staging:5000/
        method: GET
      - url: http://devsecops-flask-staging:5000/health
        method: GET
      - url: http://devsecops-flask-staging:5000/login
        method: GET
      - url: http://devsecops-flask-staging:5000/register
        method: GET

  - type: spider
    parameters:
      context: FlaskPublic
      url: http://devsecops-flask-staging:5000/login
      maxDuration: 2

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: zap-report.html

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-report.json

  - type: report
    parameters:
      template: traditional-md
      reportDir: /zap/wrk
      reportFile: zap-report.md